<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Guys</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="shared/theme.css">
<style>
  html, body { overflow: hidden; cursor: default; background: #2f5a2a; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .over { position: fixed; inset: 0; display: grid; place-items: center; padding: 3vh 3vw; }
  #results { background: rgba(24, 36, 16, .6); }
  #lobby { place-items: stretch start; padding: 2vh; }
  /* the lobby: a wooden sign on the left, the garden alive on the right */
  .sign { width: min(640px, 41vw); display: flex; flex-direction: column; gap: 1.2vh; overflow: hidden; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .logo img { max-width: 100%; height: auto; }
  .tag { font-size: clamp(17px, 2.4vh, 24px); color: var(--ink-2); text-align: center; }
  .join { display: flex; gap: 18px; align-items: center; }
  .qr { background: #fff; padding: 5px; width: min(15vh, 170px); aspect-ratio: 1; flex: none; box-shadow: 0 0 0 4px var(--ink-dk); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .join .label { font-size: clamp(15px, 2vh, 20px); color: var(--paper-ink-2); }
  .code { font-size: clamp(40px, 7vh, 80px); font-weight: 700; letter-spacing: .12em; color: var(--paper-ink); line-height: 1; margin: 2px 0 6px; }
  .url { color: var(--paper-ink-2); font-size: clamp(12px, 1.5vh, 15px); word-break: break-all; }
  .warn { color: #b8402a; font-size: 14px; margin-top: 6px; }
  h2 { margin: 0; font-size: clamp(16px, 2.2vh, 22px); font-weight: 700; color: var(--ink-2); }
  .players { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; align-items: center; }
  .pl { font-size: clamp(16px, 2.2vh, 22px); padding-right: 6px; }
  .pl.off { opacity: .5; }
  .pl img.g { margin: -6px -8px -4px -10px; }
  .empty { color: var(--ink-2); font-size: clamp(15px, 2vh, 19px); }
  .how { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .how .paper { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; font-size: clamp(13px, 1.7vh, 17px); line-height: 1.25; }
  .how .paper img { grid-row: span 2; }
  .how b { font-size: 1.2em; color: var(--paper-ink); }
  .how span { color: var(--paper-ink-2); }
  .prompt { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: clamp(18px, 2.5vh, 26px); }
  .prompt em { font-style: normal; color: var(--accent); }
  .foot { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
  .foot { flex-wrap: wrap; } .foot a { color: var(--ink-2); white-space: nowrap; }
  /* results */
  .board { width: min(1100px, 100%); display: grid; grid-template-columns: 1fr auto; gap: 2vh 3vw; align-items: start; }
  .board h1 { grid-column: 1 / -1; margin: 0; font-size: clamp(34px, 6vh, 68px); line-height: 1; text-align: center; }
  .board h1 em { font-style: normal; color: var(--accent); }
  .rank { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: auto auto 1fr auto; gap: 14px; align-items: center; font-size: clamp(16px, 2.3vh, 24px); }
  .row .who { font-weight: 700; }
  .row .who small { display: block; font-weight: 400; font-size: .7em; color: var(--paper-ink-2); }
  .row .aw { display: flex; align-items: center; gap: 8px; font-size: .85em; }
  .row .aw small { display: block; font-size: .78em; color: var(--paper-ink-2); }
  .row .pts { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.15em; }
  .side { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
  .side .qr { width: min(22vh, 220px); }
  .actions { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  /* the banner over the field: big pixel letters with a hard outline */
  #banner { position: fixed; left: 0; right: 0; top: 30vh; text-align: center; pointer-events: none; font-size: clamp(44px, 11vh, 132px); font-weight: 700; line-height: 1; color: #fff8e0; transition: opacity .25s;
    text-shadow: -.05em 0 0 #24180f, .05em 0 0 #24180f, 0 -.05em 0 #24180f, 0 .05em 0 #24180f, 0 .1em 0 #24180f; }
  #banner img { vertical-align: -.12em; margin: 0 .15em; }
  #banner small { display: block; font-size: .3em; font-weight: 600; color: var(--accent); margin-top: .45em; line-height: 1.6; }
  #banner small img { vertical-align: middle; }
  #hud { position: fixed; left: 1.2vh; top: 1vh; display: flex; align-items: center; gap: 18px; font-size: clamp(18px, 2.8vh, 30px); font-weight: 700; padding: 0 6px; }
  #hud .beds { display: flex; gap: 12px; }
  #hud .bed { display: flex; align-items: center; gap: 2px; }
  #hud .bed.dead { opacity: .45; }
  #corner { position: fixed; right: 1.2vh; top: 1vh; display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--ink-2); padding: 0 4px; }
  #corner .qr { width: 8vh; padding: 3px; box-shadow: 0 0 0 3px var(--ink-dk); }
  #corner b { display: block; color: var(--accent); font-size: 26px; letter-spacing: .1em; }
  #sound { position: fixed; left: 50%; bottom: 2vh; transform: translateX(-50%); }
  #status { position: fixed; left: 2vh; bottom: 2vh; font-size: 16px; padding: 0 6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="wood hidden"></div>
<div id="banner"></div>
<div id="corner" class="wood hidden"></div>
<div id="lobby" class="over"></div>
<div id="results" class="over hidden"></div>
<button id="sound" class="btn sm">Click anywhere for sound</button>
<div id="status" class="chip hidden"></div>
<script type="module">
import { hostRoom, param } from './shared/net.js';
import { findLan, joinUrl, qrSvg, stuckOnLocalhost } from './shared/lobby.js';
import { Sfx } from './shared/audio.js';
import { SEATS, KINDS, INTRO, CROPS, newGame, ensure, startGame, startWave, step, input, breakOver, ranking, awards, isBossWave, context, PLOTS } from './game.js';
import { drawField, tickFx, fx, burst, popup, ring, anim, drop, splat, flyer, bumpCombo, seatColor, team } from './draw.js';
import { S } from './sprites/index.js';
import { art, skin, uiScale } from './ui.js';
import { TEAMS } from './sprites/pix.js';

let PX = uiScale(300);
skin(PX);
addEventListener('resize', () => { const k = uiScale(300); if (k !== PX) { PX = k; skin(PX); renderOverlays(); } });
const A_ = (name, k = 1, o) => art(name, Math.max(1, Math.round(PX * k)), o);   // an icon at the screen's pixel scale

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cv = $('cv'), ctx = cv.getContext('2d');
const sfx = new Sfx();

let G = newGame();
let mode = 'lobby';          // lobby | countdown | play (then G.phase says wave / break / over)
let countdown = 0, bannerUntil = 0, overAt = 0, clock = 0, hitstop = 0;   // hitstop: a few frames of freeze that make a hit land
const ready = new Set();
const offSince = {};

await findLan();
const room = hostRoom({ game: 'littleguys', seats: SEATS, onSeats: () => { dirty = true; renderOverlays(); }, onAction, onStatus });
const url = joinUrl(room.room);
const qr = qrSvg(url);

const live = s => room.connected(s);
const nameOf = s => (room.seat(s)?.name || '').trim() || 'Player ' + s.slice(1);
const present = () => SEATS.filter(s => room.seat(s) && live(s));

function onStatus(s, e) {
  const el = $('status');
  el.classList.toggle('hidden', s === 'open');
  el.innerHTML = s === 'retrying' ? `<span class="dot"></span> ${esc(e?.message || 'Reconnecting to the game server')}…` : '<span class="dot"></span> Connecting…';
}

// ---------- input from phones: {j:[x,y], b} is the stick and button; {r:1} is "ready" ----------
function onAction(seat, body) {
  if (!body || typeof body !== 'object') return;
  ensure(G, seat, nameOf(seat));
  if (body.r) {
    if (mode === 'lobby' || (mode === 'play' && G.phase === 'over')) {
      if (G.phase === 'over' && performance.now() - overAt < 2500) return; // let people see the results first
      if (ready.has(seat)) ready.delete(seat); else { ready.add(seat); sfx.tick(); }
      G.players[seat].cheer = ready.has(seat);
      dirty = true; renderOverlays(); maybeStart();
    }
    return;
  }
  if (Array.isArray(body.j)) { input(G, seat, { x: body.j[0], y: body.j[1], b: body.b }); drainLog(); }
}

function maybeStart() {
  const here = present();
  if (here.length && here.every(s => ready.has(s))) beginCountdown();
}
function beginCountdown() {
  if (!present().length) return;
  mode = 'countdown'; countdown = 3.99; ready.clear(); dirty = true;
  for (const p of Object.values(G.players)) p.cheer = false;
  sfx.select(); renderOverlays();
}

// ---------- rules events → sound and sparkle ----------
const GUTS = { beetle: ['#2f7a5a', '#8fd0a0', '#1c3a2a'], hopper: ['#8ac040', '#d8f080', '#4a7a20'], stag: ['#3a3050', '#9a8ac0', '#c0c0d8'],
  stinkbug: ['#7a8a3a', '#c0c860'], snail: ['#d8a070', '#f0d0a0', '#8a5030'], queen: ['#6a3aa0', '#c08aff', '#ffd23f'], weed: ['#5fb83f', '#a6e05a', '#fff'], ladybug: ['#e03030', '#222'] };
// [icon, title, line, flash colour]
const POWER = {
  rain: ['cloud_rain', 'Rain!', 'every bed gets a drink', '#8ac4ff'], bees: ['bee', 'Bees!', 'the bees sting the nearest pests', '#ffd23f'],
  giant: ['mushroom', 'Giant!', 'grows huge for a while', '#ff9a3c'], bloom: ['bloom', 'Bloom!', 'every living crop is ripe. Harvest!', '#ffe680'],
};
function drainLog() {
  if (G.log.length) dirty = true;
  for (const [k, ...a] of G.log.splice(0)) {
    if (k === 'bonk') {
      const [s, hits] = a, p = G.players[s];
      if (!hits) sfx.swish();
      // a little dust where the rake head lands (bonk frame 0 puts it ~11 px in front of the feet)
      if (p) for (let n = 0; n < 4; n++) burst(p.x + Math.sign(p.fx || 1) * 0.37, p.y - 0.03, ['#d8c8a0', '#efe6d2'], 1, 25, 18);
    } else if (k === 'hit') {
      const [s, , x, y, how] = a, p = G.players[s];
      sfx.bonk(p ? p.combo : 0); burst(x, y, ['#ffffff', '#fff3b0'], 5, 50, 30);
      if (p) bumpCombo(s);
      hitstop = Math.max(hitstop, how === 'spin' ? 0.03 : 0.018);
      if (p && p.combo && p.combo % 10 === 0) { popup(p.x, p.y - 0.6, `${p.combo} combo!`, team(s).l, 1.1, null, 'flame'); sfx.rep(p.combo / 10 + 4); }
    } else if (k === 'multi') {
      const [s, n, x, y, bonus] = a, p = G.players[s];
      const word = n >= 6 ? 'MEGA SWEEP!' : ['', '', 'DOUBLE!', 'TRIPLE!', 'QUAD!', 'PENTA!'][n];
      popup(p ? p.x : x, (p ? p.y : y) - 1.0, `${word} +${bonus}`, n >= 4 ? '#ff7a3c' : '#ffe14d', 1 + Math.min(0.9, n * 0.15), 'multi' + s, 'bolt');
      sfx.multi(n); fx.shake = Math.max(fx.shake, 6 + n * 3); hitstop = Math.max(hitstop, 0.05 + n * 0.02);
      if (n >= 4) { fx.flash = 0.5; fx.flashColor = '#ffd23f'; burst(x, y, ['#ffd23f', '#ffffff', '#ff7a3c'], 30, 120, 90); }
    } else if (k === 'bowl') {
      const [s, x, y] = a; sfx.bowl(); burst(x, y, ['#ffffff', '#ffe680'], 6, 60, 40); fx.shake = Math.max(fx.shake, 5);
    } else if (k === 'tally') {
      const [hearts, bonus] = a;
      setTimeout(() => { popup(8, 7.4, `Garden bonus: ${hearts} hearts, +${bonus} each`, '#c8f0a0', 0.9, null, 'seedling'); for (let n = 0; n < Math.min(18, hearts); n++) setTimeout(() => sfx.coin(n), n * 55); }, 1400);
    } else if (k === 'clink') {
      const [, x, y] = a; sfx.clink(); burst(x, y, ['#ffffff', '#ffe680', '#c0c0d8'], 6, 80, 50); popup(x, y - 0.2, 'clink!', '#d8dcff', 0.8);
    } else if (k === 'launch') {
      sfx.boing();
    } else if (k === 'kill') {
      const [s, kind, x, y, pts, how] = a;
      if (kind === 'queen') {
        sfx.boom(); fx.shake = 30; fx.flash = 1; fx.flashColor = '#ffd23f'; hitstop = 0.3; splat(x, y, GUTS.queen, 3);
        burst(x, y, GUTS.queen, 50, 140, 90); anim('fx_poof', 'idle', x, y, { life: 0.5 });
        banner(`${A_('crown', 4)}The queen is down!<small>+300 each, and every bed heals</small>`, 3);
      } else {
        if (kind !== 'stinkbug') sfx.squish(G.players[s]?.combo || 0); fx.shake = Math.max(fx.shake, 4);
        if (kind !== 'weed' && kind !== 'ladybug') splat(x, y, GUTS[kind] || '#fff', kind === 'snail' ? 1.3 : 1);
        hitstop = Math.max(hitstop, 0.045);
        anim('fx_poof', 'idle', x, y, { life: 0.38 });
        burst(x, y, GUTS[kind] || '#fff', 12, 70, 45);
        if (pts) popup(x, y - 0.2, '+' + pts, '#fff', 0.85);
      }
    } else if (k === 'stink') {
      const [x, y] = a; sfx.stink(); fx.shake = Math.max(fx.shake, 8);
      anim('fx_stink', 'idle', x, y + 0.3, { life: 0.9 }); ring(x, y, 1.4, '#c8d860', 0.35);
    } else if (k === 'ouch') {
      const [s, x, y] = a; sfx.ouch(); popup(x, y - 0.6, 'dizzy!', '#ffe14d', 0.8);
    } else if (k === 'wake') {
      const [s, o] = a, q = G.players[o]; sfx.wake(); if (q) popup(q.x, q.y - 0.6, `${nameOf(s)} woke ${nameOf(o)}!`, team(s).l, 0.75);
    } else if (k === 'spin') {
      const [s, r, full] = a, p = G.players[s]; sfx.spin(full); ring(p.x, p.y, r, full ? '#ffffff' : team(s).l, 0.3);
    } else if (k === 'charged') {
      sfx.charged();
    } else if (k === 'water') {
      const [s, i, hp] = a, pl = G.plots[i]; sfx.water(); popup(pl.x, pl.y - 0.9, hp === 1 ? 'Saved!' : '', '#8ac4ff', 0.8, null, 'drop');
    } else if (k === 'harvest') {
      const [s, i] = a, pl = G.plots[i], p = G.players[s]; sfx.pluck();
      burst(pl.x, pl.y, ['#7a4f33', '#9a6a44', '#5fb83f'], 16, 70, 70);
      // all four plants pop out and hop to the gardener, one after another
      [[-14, -7], [14, -7], [-14, 9], [14, 9]].forEach(([dx, dy], k) => setTimeout(() => {
        flyer(S['crop_' + pl.crop], 'grow', 3, pl.x + dx / 30, pl.y + dy / 30, p.x + (k - 1.5) * 0.12, p.y - 0.05, () => {
          sfx.coin(k); burst(p.x, p.y - 0.3, ['#ffe680', '#ffffff'], 5, 50, 50);
          if (k === 3) { popup(p.x, p.y - 0.7, '+150', '#ffe680', 1.2, null, 'crop_' + pl.crop); anim('fx_sparkle', 'idle', p.x, p.y - 0.5, { life: 0.4 }); }
        });
      }, k * 70));
    } else if (k === 'bite') {
      const [i, hp, x, y] = a, pl = G.plots[i]; sfx.munch(); burst(x, y, ['#5fb83f', '#a6e05a'], 4, 40, 30);
    } else if (k === 'wilt') {
      const [i] = a, pl = G.plots[i]; sfx.wilt(); fx.shake = 14; fx.flash = 0.6; fx.flashColor = '#ff3355';
      popup(pl.x, pl.y - 0.4, `the ${pl.crop}s wilted!`, '#ff8a8a', 1);
      if (G.plots.filter(p => p.hp > 0).length === 1) banner(`${A_('wilted', 4)}Last bed!<small>stand in a wilted bed to water it back</small>`, 2.5);
    } else if (k === 'power') {
      const [kind, s, x, y] = a, [ic, t, sub, c] = POWER[kind];
      sfx.chime(); sfx[kind === 'rain' ? 'rain' : kind === 'bees' ? 'buzz' : kind === 'giant' ? 'grow' : 'heal']();
      fx.flash = 0.7; fx.flashColor = c; burst(x, y, ['#e03030', '#ffffff', '#222'], 16, 90, 70);
      banner(`${A_(ic, 5)}${t}<small>${esc(nameOf(s))} caught a ladybug: ${kind === 'giant' ? esc(nameOf(s)) + ' ' : ''}${sub}</small>`, 2.2);
      if (kind === 'rain') for (const pl of G.plots) for (let n = 0; n < 8; n++) setTimeout(() => drop(pl.x + (Math.random() - 0.5) * 1.8, pl.y + (Math.random() - 0.5) * 1.2, 60), n * 60);
      if (kind === 'bloom') for (const pl of G.plots) if (pl.hp > 0) burst(pl.x, pl.y, ['#ffe680', '#ffffff'], 10, 60, 60);
    } else if (k === 'bee') {
      const [x, y] = a; anim('fx_bee', 'fly', x, y - 0.3, { life: 0.6 }); burst(x, y, ['#ffd23f', '#222'], 6, 50, 40);
    } else if (k === 'escape') {
      const [x, y] = a; popup(Math.max(0.8, Math.min(15.2, x)), y, 'The ladybug flew off', '#ffcf33', 0.7, null, 'ladybug');
    } else if (k === 'sprout') {
      const [x, y] = a; anim('fx_poof', 'idle', x, y, { life: 0.3 });
    } else if (k === 'wave') {
      const [n, fresh] = a; sfx.horn();
      const sub = isBossWave(n) ? `${A_('crown', 1.4)} The beetle queen is coming!`
        : fresh.length ? fresh.filter(f => INTRO[f]).map(f => `${A_(f, 1.4)} ${INTRO[f]}`).join('<br>') : 'Protect the garden!';
      banner(`Wave ${n}<small>${sub}</small>`, fresh.length ? 3.6 : 2.2);
      baseBpm = 112 + Math.min(36, n * 3); sfx.bpm = baseBpm;
    } else if (k === 'cleared') {
      const [n, perfect] = a; sfx.cheer();
      if (perfect) for (const pl of G.plots) burst(pl.x, pl.y, ['#ffd23f', '#ffffff'], 12, 80, 70);
      banner(perfect ? `${A_('star', 4)}Perfect wave!${A_('star', 4)}<small>not a single nibble · +${100 * n} each</small>` : `Wave ${n} cleared!<small>stand in thirsty beds to water them, pick the ripe ones</small>`, 3);
    } else if (k === 'over') {
      sfx.stopMusic(); sfx.hurt(); ready.clear(); overAt = performance.now(); renderOverlays();
    }
  }
}
let baseBpm = 116;

function banner(html, secs) { $('banner').innerHTML = html; bannerUntil = performance.now() + secs * 1000; }

// ---------- overlays ----------
const howCard = (icon, title, line) => `<div class="paper sm">${A_(icon, 1)}<b>${title}</b><span>${line}</span></div>`;
const HOW = () => `<div class="how">
    ${howCard('stick', 'Walk', 'Drag on the left side of your phone.')}
    ${howCard('tap', 'Bonk', 'Tap to whack bugs. Bonk ripe crops to pick them.')}
    ${howCard('spin', 'Spin', 'Hold, then let go. It cracks armoured stag beetles.')}
    ${howCard('drop', 'Water', 'Hold in a bitten bed to heal it. Wilted beds too.')}
  </div>`;

// a gardener in the player's own colour, for their name chip
const guy = (s, k = 1) => art('gardener', Math.max(1, Math.round(PX * k * 0.5)), { team: TEAMS[SEATS.indexOf(s)], cls: 'g' });
function playersHtml(showReady) {
  const seats = SEATS.filter(s => room.seat(s));
  if (!seats.length) return '<div class="empty">Nobody yet. Grab a phone!</div>';
  return seats.map(s => `<span class="chip pl${live(s) ? '' : ' off'}">${guy(s)}<span style="color:${team(s).l}">${esc(nameOf(s))}</span>${showReady && ready.has(s) ? A_('check', 0.67) : ''}${live(s) ? '' : A_('zzz', 0.67)}</span>`).join('');
}

function renderOverlays() {
  const lobby = mode === 'lobby', over = mode === 'play' && G.phase === 'over';
  $('lobby').classList.toggle('hidden', !lobby);
  $('results').classList.toggle('hidden', !over);
  $('corner').classList.toggle('hidden', lobby || over);
  $('hud').classList.toggle('hidden', lobby || over || mode === 'countdown');
  const here = present(), waiting = here.filter(s => !ready.has(s)).length;
  const prompt = here.length ? (waiting ? `Everyone tap <em>Ready</em> (${here.length - waiting}/${here.length})` : 'Here we go!') : 'Up to 8 gardeners can play';
  if (lobby) {
    const html = `<div class="sign wood">
      <div class="logo">${art('logo', PX)}<div class="tag">Grow the garden. Bonk the bugs.</div></div>
      <div class="join paper sm"><div class="qr">${qr}</div><div><div class="label">Scan to join, or type the code</div><div class="code">${esc(room.room)}</div><div class="url">${esc(url)}</div>
        ${stuckOnLocalhost(url) ? '<div class="warn">This page is on localhost, so phones can\'t reach that link. Run <b>npm start</b> and open the address it prints.</div>' : ''}</div></div>
      <h2>In the garden</h2>
      <div class="players">${playersHtml(true)}</div>
      <div class="prompt">${prompt} ${here.length ? '<button class="btn sm go" data-act="start">Start now</button>' : ''}</div>
      ${HOW()}
      <div class="foot">${A_('phone_landscape', 0.67)} Hold your phone sideways. Bonk the weeds while you wait.${self === top ? ' · <a href="dev.html">dev mode</a> · <a href="sprites.html">sprites</a>' : ''}</div>
    </div>`;
    if ($('lobby').innerHTML !== html) $('lobby').innerHTML = html;
  }
  if (over) {
    const A = awards(G), MEDAL = ['medal_gold', 'medal_silver', 'medal_bronze'];
    const rows = ranking(G).map(([s, p], i) => `<div class="row paper">
        <span>${MEDAL[i] ? A_(MEDAL[i], 1) : `<b style="display:inline-block;width:${12 * PX}px;text-align:center">${i + 1}</b>`}</span>
        ${guy(s, 1.2)}
        <div><div class="who" style="color:${team(s).d}">${esc(nameOf(s))}<small>${p.kills} pests · ${p.harvests} picked · ${p.waters} watered · best combo ${p.best}</small></div>
          <div class="aw">${A_(A[s].icon, 0.67)}<span><b>${esc(A[s].title)}</b> <small>${esc(A[s].why)}</small></span></div></div>
        <span class="pts">${p.score.toLocaleString()}</span></div>`).join('');
    const html = `<div class="board wood">
      <h1>The garden fell on <em>wave ${G.wave}</em></h1>
      <div class="rank">${rows}</div>
      <div class="side"><div class="qr">${qr}</div><div>More gardeners can join.<br>Code <b style="color:var(--accent)">${esc(room.room)}</b></div></div>
      <div class="actions"><span class="prompt">${prompt}</span><button class="btn sm go" data-act="start">Play again</button><button class="btn sm" data-act="lobby">Back to the lobby</button></div>
      <div class="players" style="grid-column:1/-1;justify-content:center">${playersHtml(true)}</div>
    </div>`;
    if ($('results').innerHTML !== html) $('results').innerHTML = html;
  }
  const corner = `<div class="qr">${qr}</div><div>Join in<b>${esc(room.room)}</b></div>`;
  if ($('corner').innerHTML !== corner) $('corner').innerHTML = corner;
  const snd = `${A_(sfx.ac ? 'speaker_on' : 'speaker_off', 0.67)} Click anywhere for sound`;
  if ($('sound').innerHTML !== snd) $('sound').innerHTML = snd;
}
function renderHud() {
  const beds = G.plots.map(pl => `<span class="bed${pl.hp ? '' : ' dead'}">${A_(pl.hp ? 'crop_' + pl.crop : 'wilted', 0.67)}${[0, 1, 2].map(k => A_(k < pl.hp ? 'heart' : 'heart_empty', 0.5)).join('')}</span>`).join('');
  const html = `<span>Wave ${G.wave}</span><span class="beds">${beds}</span>`;
  if ($('hud').innerHTML !== html) $('hud').innerHTML = html;
}

document.addEventListener('click', e => {
  sfx.init(); $('sound').classList.add('hidden');
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'start') beginCountdown();
  if (act === 'lobby') toLobby();
});
function toLobby() { sfx.stopMusic(); const keep = G.players; G = newGame(); for (const [s, p] of Object.entries(keep)) { const q = ensure(G, s, p.name); q.x = p.x; q.y = p.y; } mode = 'lobby'; ready.clear(); dirty = true; renderOverlays(); }
addEventListener('keydown', e => {
  sfx.init(); $('sound').classList.add('hidden');
  if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
  else if (e.key === 'm' || e.key === 'M') sfx.setMuted(!sfx.muted);
  else if (e.key === 'Escape') toLobby();
  else if ((e.key === ' ' || e.key === 'Enter') && (mode === 'lobby' || G.phase === 'over')) beginCountdown();
});

// ---------- telling the phones how they are doing: one broadcast for everyone ----------
let dirty = true, lastSent = 0, lastCtx = '';
function snapshot() {
  const phase = mode === 'play' ? G.phase : mode, over = mode === 'play' && G.phase === 'over', A = over ? awards(G) : {};
  const p = {};
  for (const s of SEATS) {
    if (!room.seat(s)) continue;
    const q = G.players[s], award = over && A[s] ? [A[s].icon, A[s].title, A[s].why] : null;
    p[s] = q ? [q.score, q.combo, q.ev, q.last, ready.has(s) ? 1 : 0, nameOf(s), q.stun > 0 ? 1 : 0, award, context(G, q), q.giantT > 0 ? 1 : 0, q.multi]
             : [0, 0, 0, '', ready.has(s) ? 1 : 0, nameOf(s), 0, null, 0, 0];
  }
  return { t: 's', ph: phase, w: G.wave, beds: G.plots.map(pl => pl.hp), cd: Math.ceil(mode === 'countdown' ? countdown : G.phase === 'break' ? G.timer : 0),
    n: present().length, p, rank: over ? ranking(G).map(([s]) => s) : null, tev: G.tev, tl: G.tlast };
}
function sync(now) {
  // the button label depends on where you stand, so a change of context is worth a message too
  const ctxKey = Object.values(G.players).map(q => context(G, q) + (q.stun > 0 ? 'd' : '')).join('');
  if (ctxKey !== lastCtx) { lastCtx = ctxKey; dirty = true; }
  if ((dirty && now - lastSent > 80) || now - lastSent > 400) { room.all(snapshot()); lastSent = now; dirty = false; }
}

// ---------- the loop ----------
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize); resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;

  for (const s of SEATS) {
    if (room.seat(s) && !live(s)) { offSince[s] ??= now; if ((mode === 'lobby' || G.phase === 'over') && now - offSince[s] > 15000) { room.free(s); ready.delete(s); delete offSince[s]; delete G.players[s]; renderOverlays(); } }
    else delete offSince[s];
    if (room.seat(s)) ensure(G, s, nameOf(s));
  }

  if (mode === 'lobby') {
    if (hitstop > 0) hitstop -= dt; else step(G, dt, live);
  } else if (mode === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt; step(G, dt, live);
    if (Math.ceil(countdown) !== before) { dirty = true; if (countdown > 0) sfx.beep(false); }
    banner(countdown > 0 ? String(Math.ceil(countdown)) : 'GO!', 0.6);
    if (countdown <= 0) {
      if (!present().length) toLobby();
      else { startGame(G, present()); for (const s of present()) G.players[s].name = nameOf(s); mode = 'play'; sfx.beep(true); sfx.startMusic(116); dirty = true; renderOverlays(); }
    }
  } else if (mode === 'play' && hitstop > 0) {
    hitstop -= dt;
  } else if (mode === 'play') {
    const before = G.phase;
    step(G, dt, live);
    if (breakOver(G)) startWave(G);
    if (G.phase !== before) { dirty = true; renderOverlays(); }
  }
  drainLog();
  tickFx(dt);
  // a watering can pours while you stand in a thirsty bed
  for (const p of Object.values(G.players)) if (p.watering && p.waterT > 0.12 && Math.random() < dt * 14) drop(p.x + Math.sign(p.fx || 1) * 0.27, p.y - 0.05, 5);
  drawField(ctx, G, { W: cv.width, H: cv.height, live, name: nameOf, t: clock });
  if (mode !== 'lobby') renderHud();
  $('banner').style.opacity = now < bannerUntil ? 1 : 0;
  sync(now);
  requestAnimationFrame(frame);
}
if (param('debug') != null) window.lg = { get G() { return G; }, get mode() { return mode; }, context, input };
renderOverlays();
requestAnimationFrame(frame);
setInterval(renderOverlays, 1000);
</script>
</body>
