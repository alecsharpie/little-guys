<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Guys · Dev</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  /* The TV and N phones in one tab over BroadcastChannel (?net=local): no relay, no real phones. */
  body { display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 8px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
  .bar b { color: var(--ink); font-size: 17px; }
  .bar select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .tv { flex: 1; min-height: 0; display: grid; place-items: center; }
  .tv .screen { position: relative; border: 6px solid #0f160a; border-radius: 12px; overflow: hidden; background: #000; }
  .tv iframe { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; }
  .phones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .phone { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .phone .shell { position: relative; border: 5px solid #0f160a; border-radius: 18px; overflow: hidden; background: var(--bg); outline: 3px solid transparent; }
  .phone .shell.focus { outline-color: var(--accent); }
  .phone iframe { position: absolute; top: 0; left: 0; width: 780px; height: 360px; border: 0; transform-origin: 0 0; }
  .phone .ctl { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="bar">
  <b>Little Guys · dev</b>
  <label>Phones <select id="n"></select></label>
  <label><input type="checkbox" id="allbots"> all bots</label>
  <span>Click a phone, then WASD / arrows to walk, hold space for the button, R for ready. The mouse works on the phones too.</span>
  <a href="index.html" style="color:var(--ink-2);margin-left:auto">real TV page →</a>
</div>
<div class="tv"><div class="screen" id="tv"></div></div>
<div class="phones" id="phones"></div>
<script>
const q = new URLSearchParams(location.search);
const N = Math.max(1, Math.min(8, +q.get('players') || 3));
const room = 'DEVXX';
const NAMES = ['Ada', 'Bo', 'Cy', 'Di', 'Ed', 'Flo', 'Gus', 'Hal'];
const $ = id => document.getElementById(id);

for (let i = 1; i <= 8; i++) $('n').add(new Option(i, i, i === N, i === N));
$('n').onchange = () => { q.set('players', $('n').value); location.search = q; };

const tv = document.createElement('iframe');
tv.src = `index.html?net=local&room=${room}&debug`;
$('tv').appendChild(tv);

const phones = [];
for (let i = 0; i < N; i++) {
  const wrap = document.createElement('div'); wrap.className = 'phone';
  wrap.innerHTML = `<div class="shell"><iframe src="pad.html?net=local&room=${room}&cid=dev-${i}&name=${NAMES[i]}&auto"></iframe></div>
    <div class="ctl"><span>${NAMES[i]}</span><label><input type="checkbox" class="bot"${q.has('bots') ? ' checked' : ''}> bot</label></div>`;
  $('phones').appendChild(wrap);
  const f = wrap.querySelector('iframe'), bot = wrap.querySelector('.bot'), shell = wrap.querySelector('.shell');
  f.addEventListener('load', () => f.contentWindow.addEventListener('focus', () => document.querySelectorAll('.shell').forEach(s => s.classList.toggle('focus', s === shell))));
  phones.push({ f, bot, shell, i });
}
$('allbots').checked = q.has('bots');
$('allbots').onchange = () => phones.forEach(p => { p.bot.checked = $('allbots').checked; });

// phones are landscape 780×360; the TV keeps 16:9 in what is left
function fit() {
  const W = innerWidth - 20, per = Math.min(4, N), ps = Math.min(0.42, (W - (per - 1) * 10) / per / 790);
  for (const p of phones) { p.shell.style.width = 780 * ps + 'px'; p.shell.style.height = 360 * ps + 'px'; p.f.style.transform = `scale(${ps})`; }
  const box = document.querySelector('.tv'), tw = Math.min(box.clientWidth - 12, (box.clientHeight - 12) * 16 / 9);
  $('tv').style.width = tw + 'px'; $('tv').style.height = tw * 9 / 16 + 'px';
  tv.style.transform = `scale(${tw / 1600})`;
}
addEventListener('resize', fit); fit(); requestAnimationFrame(fit); setTimeout(fit, 300);

// Bots: walk to the most urgent pest and bonk it; charge a spin for stag beetles; water wilting beds; harvest ripe ones.
const brain = new Map();
let overSince = 0;
setInterval(() => {
  const game = tv.contentWindow?.lg; if (!game) return;
  const { G, mode } = game, now = performance.now();
  if (G.phase === 'over') overSince ||= now; else overSince = 0;
  for (const ph of phones) {
    const pad = ph.f.contentWindow?.lgPad;
    if (!ph.bot.checked || !pad || !pad.seat) continue;
    const me = G.players[pad.seat]; if (!me) continue;
    const b = brain.get(ph.i) || { tap: 0 }; brain.set(ph.i, b);
    if (mode === 'lobby' || G.phase === 'over') {
      if ((mode === 'lobby' || now - overSince > 6000) && !b.readied) { pad.ready(); b.readied = true; }
      if (mode === 'lobby') { const w = G.enemies[ph.i % Math.max(1, G.enemies.length)]; if (w) go(pad, me, w.x, w.y, 0.5, b, false); }
      continue;
    }
    b.readied = false;
    if (me.stun > 0) { pad.set(0, 0, 0); continue; }
    // a bed in trouble with nobody chewing on it: water it
    const bed = G.plots.filter(pl => pl.hp <= 1 && !pl.munchers).sort((a, c) => Math.hypot(a.x - me.x, a.y - me.y) - Math.hypot(c.x - me.x, c.y - me.y))[0];
    const pests = G.enemies.filter(e => !['weed'].includes(e.kind) && e.fly <= 0);
    const score = e => Math.hypot(e.x - me.x, e.y - me.y) + (e.eating >= 0 ? -2 : 0) + (e.kind === 'ladybug' ? -1 : 0) + ph.i * 0.3 * Math.sin(e.id);
    const tgt = pests.sort((a, c) => score(a) - score(c))[0];
    if (bed && (!tgt || Math.hypot(tgt.x - me.x, tgt.y - me.y) > 3 || G.phase === 'break')) {
      const inBed = Math.abs(me.x - bed.x) < 0.8 && Math.abs(me.y - bed.y) < 0.5;
      if (inBed) { pad.set(0, 0, 1); b.watering = true; continue; }
      b.watering = false; go(pad, me, bed.x, bed.y, 0.1, b, false); continue;
    }
    if (b.watering) { b.watering = false; pad.set(0, 0, 0); continue; }
    const ripe = G.plots.find(pl => pl.g >= 1 && pl.hp > 0 && Math.hypot(pl.x - me.x, pl.y - me.y) < 1.6);
    if (ripe && (!tgt || Math.hypot(tgt.x - me.x, tgt.y - me.y) > 1.5)) { go(pad, me, ripe.x, ripe.y, 0.2, b, true); continue; }
    if (!tgt) { pad.set(0, 0, 0); continue; }
    if (tgt.kind === 'stag') {
      // charge first, then walk up and let go
      const d = Math.hypot(tgt.x - me.x, tgt.y - me.y);
      if (!me.holding) { pad.set(0, 0, 1); continue; }
      if (me.charge >= 1 && d < 1.1) { pad.set(0, 0, 0); continue; }
      const dx = tgt.x - me.x, dy = tgt.y - me.y, m = Math.hypot(dx, dy) || 1; pad.set(dx / m, dy / m, 1); continue;
    }
    go(pad, me, tgt.x, tgt.y, 0.55, b, true);
  }
}, 60);
function go(pad, me, x, y, near, b, bonk) {
  const dx = x - me.x, dy = y - me.y, d = Math.hypot(dx, dy);
  if (d > near) { pad.set(dx / d, dy / d, 0); }
  // face it and tap: press on one tick, release on the next
  if (bonk && d < 0.85) { b.tap = !b.tap; pad.set(d > 0.3 ? dx / d * 0.3 : 0, d > 0.3 ? dy / d * 0.3 : 0, b.tap ? 1 : 0); }
  else if (d <= near) pad.set(0, 0, 0);
}
</script>
</body>
</html>
