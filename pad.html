<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Guys">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Little Guys · Controller</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="shared/theme.css">
<style>
  html, body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { --c: #8a9a6a; --cl: #c8d8a8; --cd: #4a5a3a; display: flex; flex-direction: column;
    padding: calc(4px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
    background: radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--c) 20%, var(--bg)) 0%, var(--bg) 75%); }
  body.stun { --c: #8a8a8a; --cl: #c8c8c8; --cd: #555; }
  #pad, #pad * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .top { display: flex; align-items: center; gap: 10px; min-height: 44px; white-space: nowrap; }
  .top .me { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 19px; min-width: 0; overflow: hidden; }
  #guy { flex: none; margin: -8px -4px -4px -6px; }
  .top .score { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .top .combo { display: flex; align-items: center; gap: 2px; font-size: 17px; font-weight: 700; color: var(--cl); }
  .top .sp { flex: 1; }
  .top .wave { font-weight: 600; color: var(--ink-2); font-size: 16px; }
  .top .beds { display: flex; gap: 1px; }
  #ready { min-height: 44px; font-size: 18px; }
  .ctl { flex: 1; position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; min-height: 0; }
  .zone { position: relative; overflow: hidden; }
  .zone .hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; color: var(--ink-2); font-size: 14px; pointer-events: none; opacity: .8; }
  #base, #knob { position: absolute; pointer-events: none; transform: translate(-50%, -50%); }
  .rest #base { opacity: .55; } .rest #knob { opacity: .7; }
  #btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #btn img { position: absolute; }
  #lbl { position: absolute; left: 50%; top: var(--ly, 40%); transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; white-space: nowrap;
    font-weight: 700; font-size: clamp(22px, 7vh, 34px); line-height: 1; color: #fff; text-shadow: 0 3px 0 var(--cd), 2px 0 0 var(--cd), -2px 0 0 var(--cd), 0 -2px 0 var(--cd); }
  #lbl small { font-size: .48em; font-weight: 600; }
  #btn.down #lbl { top: var(--lyd, 45%); }
  #btn.hit #face { animation: hit .16s steps(2); }
  @keyframes hit { from { filter: brightness(1.7); } to { filter: none; } }
  #btn.full #face { animation: glow .3s steps(2) infinite; }
  @keyframes glow { 50% { filter: brightness(1.35); } }
  #msg { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); pointer-events: none; text-align: center; font-weight: 700; font-size: 20px; white-space: nowrap; max-width: 96%; z-index: 2; }
  #msg:empty { display: none; }
  #msg small { display: block; font-size: 14px; font-weight: 500; color: var(--ink-2); }
  #msg img { vertical-align: middle; }
  .shout { position: absolute; left: 0; right: 0; top: 28%; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 40px; font-weight: 700; pointer-events: none; opacity: 0; z-index: 3;
    text-shadow: 0 4px 0 #24180f, 3px 0 0 #24180f, -3px 0 0 #24180f, 0 -3px 0 #24180f; }
  .shout.go { animation: shout 1.3s steps(12); }
  @keyframes shout { 0% { opacity: 0; transform: scale(.5); } 12% { opacity: 1; transform: scale(1.2); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
  .ctl.ouch { animation: ouch .4s steps(6); }
  @keyframes ouch { 0% { background: rgba(255, 60, 80, .35); transform: translateX(-10px); } 30% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 100% { background: transparent; transform: none; } }
  #card { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 30, 10, .8); text-align: center; padding: 16px; z-index: 5; }
  #card .wood { min-width: min(420px, 90vw); max-width: 94vw; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #card .big { font-size: 28px; font-weight: 700; line-height: 1.15; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #card .big small { font-size: 16px; font-weight: 500; color: var(--ink-2); }
  #card .num { font-size: 110px; font-weight: 700; color: var(--cl); line-height: 1; }
  #card .aw { display: flex; align-items: center; gap: 8px; text-align: left; font-size: 20px; }
  #card .aw small { display: block; }
  .form { margin: auto; width: min(440px, 100%); display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: center; }
  .form .logo { display: flex; justify-content: center; }
  .form input { font-size: 24px; padding: 8px; text-align: center; width: 100%; outline: none; color: var(--paper-ink); touch-action: manipulation; user-select: text; -webkit-user-select: text; }
  .form input::placeholder { color: var(--paper-ink-2); }
  .form input.code { letter-spacing: .25em; text-transform: uppercase; font-weight: 700; }
  .form .btn { min-height: 64px; font-size: 24px; }
  .note { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-2); font-size: 16px; }
  @media (orientation: portrait) { .ctl { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #stick { order: 2; } #press { order: 1; } }
  @media (orientation: landscape) and (max-height: 500px) { .form { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; width: min(720px, 100%); } .form .logo { width: 100%; } .form input { flex: 1 1 200px; } .form .btn { flex: 1 1 100%; min-height: 54px; } }
  .shake { animation: shake .3s steps(4); }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
</style>
</head>
<body>
<div id="join" class="form">
  <div class="logo" id="logo"></div>
  <input id="name" class="paper" maxlength="12" placeholder="Your name" autocomplete="nickname" enterkeyhint="go">
  <input id="room" class="paper code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters">
  <button id="go" class="btn go">Join the garden</button>
  <div class="note" id="note">The code is on the TV. Hold your phone sideways.</div>
</div>
<div id="pad" class="hidden" style="display:contents">
  <div class="top">
    <span class="me"><span id="guy"></span><span id="me"></span></span>
    <span class="score" id="score">0</span><span class="combo" id="combo"></span>
    <span class="sp"></span>
    <span class="wave" id="wave"></span><span class="beds" id="beds"></span>
    <button id="ready" class="btn go hidden">Ready</button>
  </div>
  <div class="ctl" id="ctl">
    <div class="zone rest" id="stick"><img id="base" class="px" alt=""><img id="knob" class="px" alt=""><div class="hint">drag here to walk</div></div>
    <div class="zone" id="press">
      <div id="btn"><img id="ring" class="px" alt=""><img id="face" class="px" alt=""><div id="lbl"></div></div>
    </div>
    <div id="msg"></div>
    <div class="shout" id="shout"></div>
  </div>
  <div id="card" class="hidden"><div class="wood"><div id="cardmsg" class="big"></div><button id="cardready" class="btn go hidden">Play again</button></div></div>
</div>
<script type="module">
import { joinRoom, param, load, save } from './shared/net.js';
import { SEATS, HOLD_DELAY, CHARGE_TIME, MIN_CHARGE } from './game.js';
import { TEAMS, frameAt } from './sprites/pix.js';
import { S as SPR } from './sprites/index.js';
import { art, dataUrl, skin } from './ui.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const buzz = p => { try { navigator.vibrate?.(p); } catch (e) {} };
skin(2);
$('logo').innerHTML = art('logo', innerHeight < 500 ? 2 : 3);
$('note').insertAdjacentHTML('afterbegin', art('phone_landscape', 2));

$('name').value = param('name') || load('littleguys-name', '');
$('room').value = (param('room') || '').toUpperCase();
if (param('room')) $('room').classList.add('hidden');

let net = null, seat = null, status = 'connecting', S = null, prev = null, tm = null;

function start() {
  const name = $('name').value.trim().slice(0, 12), code = $('room').value.trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{5}$/.test(code)) { $('room').classList.remove('hidden'); $('room').focus(); $('room').classList.add('shake'); setTimeout(() => $('room').classList.remove('shake'), 300); return; }
  save('littleguys-name', name);
  $('join').classList.add('hidden'); $('pad').classList.remove('hidden');
  net = joinRoom({
    room: code, name, want: param('want'),
    onSeat: s => {
      seat = s; tm = TEAMS[SEATS.indexOf(s)] || TEAMS[0];
      document.body.style.setProperty('--c', tm.c); document.body.style.setProperty('--cl', tm.l); document.body.style.setProperty('--cd', tm.d);
      layout(); push(true); render();
    },
    onMessage: m => { if (m && m.t === 's') { prev = S; S = m; feel(); render(); } },
    onStatus: s => { status = s; if (s === 'open') push(true); render(); },
  });
  layout(); render();
}
$('go').onclick = start;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

// ---------- the painted controller: sized to the zones at a whole-number pixel scale ----------
let K = 4, R = 52;
function layout() {
  const pr = $('press').getBoundingClientRect(), st = $('stick').getBoundingClientRect();
  K = Math.max(2, Math.min(6, Math.floor(Math.min(pr.width * 0.86, pr.height * 0.92) / 52)));
  const ks = Math.max(2, Math.min(5, Math.floor(Math.min(st.width, st.height) * 0.62 / 40)));
  R = 40 * ks * 0.36;
  // the ring is 52×52 round its centre; the button's housing centre is (24,27) in its 48×50 sprite, the face's centre
  // (24,21.5) when up and (24,25) when down, so the label sits on the face and drops with it
  const b = $('btn').style;
  b.width = 52 * K + 'px'; b.height = 52 * K + 'px';
  Object.assign($('ring').style, { left: '0px', top: '0px' });
  Object.assign($('face').style, { left: (26 - 24) * K + 'px', top: (26 - 27) * K + 'px' });
  b.setProperty('--ly', (26 - 27 + 21.5) * K + 'px'); b.setProperty('--lyd', (26 - 27 + 25) * K + 'px');
  $('base').src = dataUrl(SPR.pad_base, 'idle', 0, ks, tm);
  $('knob').src = dataUrl(SPR.pad_knob, 'idle', 0, ks, tm);
  face(); rest();
}
let lastRing = -1;
function face() { $('face').src = dataUrl(SPR.pad_button, held ? 'down' : 'up', 0, K, tm); }
function ringAt(k) {
  const i = Math.max(0, Math.min(15, Math.floor(k * 15.999)));
  const show = k > 0;
  $('ring').style.visibility = show ? 'visible' : 'hidden';
  if (show && i !== lastRing) { lastRing = i; $('ring').src = dataUrl(SPR.pad_ring, 'seg', i, K, tm); }
}

// ---------- what the phone shows ----------
const mine = () => (S && seat && S.p[seat]) || null;
const MEDAL = ['medal_gold', 'medal_silver', 'medal_bronze'];
function render() {
  if (!net) return;
  const me = mine(), ph = S?.ph;
  $('me').textContent = me ? me[5] : ($('name').value || 'You');
  $('wave').textContent = S && S.w ? `Wave ${S.w}` : '';
  const beds = S && S.w ? S.beds.map(h => art(h ? 'seedling' : 'wilted', 2)).join('') : '';
  if ($('beds').innerHTML !== beds) $('beds').innerHTML = beds;
  $('score').textContent = me ? me[0].toLocaleString() : '0';
  const combo = me && me[1] >= 2 ? `${me[1] >= 10 ? art('flame', 2) : ''}×${me[1]}` : '';
  if ($('combo').innerHTML !== combo) $('combo').innerHTML = combo;
  document.body.classList.toggle('stun', !!(me && me[6]));
  const pre = ph === 'lobby' || ph === 'over';
  const isReady = !!(me && me[4]);
  $('ready').classList.toggle('hidden', !(pre && seat));
  $('ready').classList.toggle('go', !isReady);
  const rd = isReady ? `${art('check', 2)} Ready` : 'Ready';
  if ($('ready').innerHTML !== rd) $('ready').innerHTML = rd;

  // the button says what it will do where you are standing
  const ctx = me ? me[8] : 0;
  btnCtx = ctx;
  const lbl = me && me[6] ? `${art('swirl', 3)}<small>dizzy!</small>`
    : ctx & 2 ? `${art('carrot', 2)}PICK<small>tap · hold to spin</small>`
    : ctx & 1 ? `BONK<small>${art('drop', 1)} stand still: water</small>`
    : 'BONK<small>hold to spin</small>';
  if ($('lbl').innerHTML !== lbl) $('lbl').innerHTML = lbl;

  let msg = '';
  if (ph === 'lobby') msg = isReady ? `Ready!<small>waiting for the others (${Object.values(S.p).filter(p => p[4]).length}/${S.n})</small>` : 'Bonk the weeds to practise<small>tap Ready when you are set</small>';
  else if (ph === 'break') msg = `Wave cleared!<small>next one in ${S.cd}. Water and pick!</small>`;
  else if (me && me[6]) msg = `${art('swirl', 2)} Dizzy!<small>a friend can bonk you awake</small>`;
  else if (me && me[9]) msg = `${art('mushroom', 2)} Giant!`;
  if ($('msg').innerHTML !== msg) $('msg').innerHTML = msg;

  let card = '';
  if (status === 'full') card = `${art('cross', 4)}This garden is full<small>8 gardeners at most. Try again soon.</small>`;
  else if (status !== 'open' || !seat) card = `${art('clock', 4)}Connecting…<small>${status === 'waiting' ? 'looking for the TV' : ''}</small>`;
  else if (!S) card = `${art('check', 4)}Connected!`;
  else if (ph === 'countdown') card = `<div class="num">${S.cd || 'GO!'}</div>`;
  else if (ph === 'over' && S.rank) {
    const i = S.rank.indexOf(seat), aw = me && me[7];
    card = `${MEDAL[i] ? art(MEDAL[i], 6) : `<div class="num" style="font-size:64px">#${i + 1}</div>`}<div>${me ? me[0].toLocaleString() : 0} points</div>
      ${aw ? `<div class="aw paper">${art(aw[0], 3)}<div><b>${esc(aw[1])}</b><small>${esc(aw[2])}</small></div></div>` : ''}
      <small>${isReady ? `waiting for the others (${Object.values(S.p).filter(p => p[4]).length}/${S.n})` : 'Tap below to play again'}</small>`;
  }
  $('card').classList.toggle('hidden', !card);
  if ($('cardmsg').innerHTML !== card) $('cardmsg').innerHTML = card;
  $('cardready').classList.toggle('hidden', ph !== 'over');
  const cr = isReady ? `${art('check', 2)} Ready` : 'Play again';
  if ($('cardready').innerHTML !== cr) $('cardready').innerHTML = cr;
}
const sendReady = () => { if (net) { net.act({ r: 1 }); buzz(15); } };
$('ready').addEventListener('pointerdown', e => { e.stopPropagation(); sendReady(); });
$('cardready').addEventListener('pointerdown', e => { e.stopPropagation(); sendReady(); });

// my little guy in the corner, in my colour
let guyKey = '';
function guy(now) {
  const me = mine(), set = me && me[6] ? 'dizzy' : held ? 'charge' : 'idle', i = frameAt(SPR.gardener, set, now / 1000);
  const key = set + i + (tm ? tm.c : '');
  if (key !== guyKey) { guyKey = key; $('guy').innerHTML = `<img class="px" src="${dataUrl(SPR.gardener, set, i, 2, tm)}" alt="">`; }
  requestAnimationFrame(guy);
}
requestAnimationFrame(guy);

// ---------- buzz and shout for what happened on the TV ----------
const TEAM = { rain: ['cloud_rain', 'Rain!', [30, 30, 30, 30, 30]], bees: ['bee', 'Bees!', [80, 30, 80]], giant: ['mushroom', 'Giant!', [100, 50, 100]], bloom: ['bloom', 'Bloom!', [30, 30, 120]],
  perfect: ['star', 'Perfect!', [30, 30, 30, 30, 120]], queen: ['crown', 'Queen down!', [100, 50, 300]] };
const BUZZ = { multi: [30, 20, 30, 20, 80], hit: 14, kill: [20, 30, 25], clink: [8, 20, 8], ouch: 220, gift: [30, 30, 30, 30, 120], harvest: [20, 40, 60], water: 25, wake: [20, 20, 40], woke: [60, 40, 60], charged: 35, spin: [40, 30, 80], launch: 18 };
function shout(text, color = '#fff', icon = null) {
  const el = $('shout'); el.innerHTML = (icon ? art(icon, 4) : '') + `<span>${text}</span>`; el.style.color = color;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
function feel() {
  const a = prev && seat && prev.p[seat], b = mine();
  if (!b) return;
  if (a && b[2] !== a[2]) {
    buzz(BUZZ[b[3]] || 10);
    if (['hit', 'kill', 'multi', 'harvest', 'gift'].includes(b[3])) { const k = $('btn'); k.classList.remove('hit'); void k.offsetWidth; k.classList.add('hit'); }
    if (b[3] === 'multi') shout(b[10] >= 6 ? 'MEGA SWEEP!' : ['', '', 'DOUBLE!', 'TRIPLE!', 'QUAD!', 'PENTA!'][b[10]] || 'MULTI!', b[10] >= 4 ? '#ff9a3c' : '#ffe14d', 'bolt');
    if (b[3] === 'ouch') { const c = $('ctl'); c.classList.remove('ouch'); void c.offsetWidth; c.classList.add('ouch'); }
    if (b[3] === 'harvest') shout('+150', 'var(--accent)', 'carrot');
    if (b[3] === 'woke') shout('Awake!', '#fff', 'friends');
    if (b[3] === 'clink') shout('Clink! Hold to spin', '#d8dcff');
    if (b[1] >= 10 && b[1] % 10 === 0 && b[1] !== a[1]) shout(`${b[1]} combo!`, 'var(--cl)', 'flame');
  }
  if (prev && S.beds.filter(Boolean).length < prev.beds.filter(Boolean).length) { buzz([80, 40, 80]); shout('A bed wilted!', '#ff9a9a', 'wilted'); }
  if (prev && S.tev !== prev.tev && TEAM[S.tl]) { const [ic, t, v] = TEAM[S.tl]; shout(t, '#fff', ic); buzz(v); }
  if (prev && prev.ph !== S.ph && S.ph === 'wave') buzz([30, 60, 30]);
}

// ---------- the controller ----------
// Sends {j:[x,y], b} whenever it changes: the stick at most 20 times a second, the button at once.
let jx = 0, jy = 0, held = false, sent = '', lastSend = 0, timer = null, btnCtx = 0, pressAt = 0, buzzedFull = false;
const q = v => Math.round(v * 20) / 20;
function push(force) {
  if (!net || !seat) return;
  const body = { j: [q(jx), q(jy)], b: held ? 1 : 0 }, key = JSON.stringify(body);
  if (key === sent && !force) return;
  const now = performance.now();
  clearTimeout(timer);
  if (force || now - lastSend >= 50) { net.act(body); sent = key; lastSend = now; }
  else timer = setTimeout(() => push(), 50 - (now - lastSend));
}
function setButton(down) {
  if (down === held) return;
  held = down; $('btn').classList.toggle('down', down); face();
  if (down) { pressAt = performance.now(); buzzedFull = false; buzz(10); }
  push(true);
}

// floating stick: it centres wherever your thumb lands, and follows if you drag past its edge
const DEAD = 0.14;
let stickId = null, bx = 0, by = 0, btnId = null;
function rest() {
  const z = $('stick').getBoundingClientRect();
  bx = z.width / 2; by = z.height / 2; place(0, 0); $('stick').classList.add('rest');
}
function place(dx, dy) {
  // whole pixels of the sprite's scale, so the knob moves in crisp steps
  $('base').style.left = Math.round(bx) + 'px'; $('base').style.top = Math.round(by) + 'px';
  $('knob').style.left = Math.round(bx + dx) + 'px'; $('knob').style.top = Math.round(by + dy) + 'px';
}
function stickMove(cx, cy) {
  const z = $('stick').getBoundingClientRect();
  let dx = cx - z.left - bx, dy = cy - z.top - by, d = Math.hypot(dx, dy);
  if (d > R) { bx += dx * (1 - R / d); by += dy * (1 - R / d); dx *= R / d; dy *= R / d; d = R; }
  place(dx, dy);
  const m = d / R, k = m < DEAD ? 0 : (m - DEAD) / (1 - DEAD);
  jx = d ? dx / d * k : 0; jy = d ? dy / d * k : 0;
  push();
}
addEventListener('pointerdown', e => {
  if (!net || e.target.closest('input,button')) return;
  const st = $('stick').getBoundingClientRect(), pr = $('press').getBoundingClientRect();
  const inside = r => e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (inside(st) && stickId === null) {
    stickId = e.pointerId; $('stick').classList.remove('rest');
    bx = Math.max(R, Math.min(st.width - R, e.clientX - st.left)); by = Math.max(R, Math.min(st.height - R, e.clientY - st.top));
    stickMove(e.clientX, e.clientY);
  } else if (inside(pr) && btnId === null) { btnId = e.pointerId; setButton(true); }
}, { passive: true });
addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e.clientX, e.clientY); }, { passive: true });
const up = e => {
  if (e.pointerId === stickId) { stickId = null; jx = jy = 0; rest(); push(true); }
  if (e.pointerId === btnId) { btnId = null; setButton(false); }
};
addEventListener('pointerup', up); addEventListener('pointercancel', up);
// iOS Safari ignores user-scalable=no: without this, a quick double tap zooms the page and a long press selects text
// and pops the magnifier. Cancelling the touches themselves stops all three; pointer events still arrive. The join
// form is left alone so its text boxes and button work normally.
const ours = e => !e.target.closest('#join');
for (const t of ['touchstart', 'touchmove', 'touchend']) document.addEventListener(t, e => { if (ours(e) && e.cancelable) e.preventDefault(); }, { passive: false });
for (const t of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart']) document.addEventListener(t, e => { if (ours(e)) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') { stickId = btnId = null; jx = jy = 0; held = false; push(true); rest(); face(); } });
addEventListener('resize', () => { if (net) layout(); });

// the ring round the button: the spin charging up, from the moment you press
(function ring(now) {
  let k = 0;
  if (held) {
    const t = (now - pressAt) / 1000;
    k = Math.max(0, Math.min(1, (t - HOLD_DELAY) / CHARGE_TIME));
    const full = k >= 1;
    $('btn').classList.toggle('full', full);
    if (full && !buzzedFull) { buzzedFull = true; buzz(30); }
    if (k < MIN_CHARGE) k = 0;
  } else $('btn').classList.remove('full');
  if (net) ringAt(k);
  requestAnimationFrame(ring);
})(0);

// keys, for testing on a laptop: WASD / arrows walk, space is the button, R is ready
const keys = new Set();
const KEYV = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
function fromKeys() {
  let x = 0, y = 0; for (const k of keys) if (KEYV[k]) { x += KEYV[k][0]; y += KEYV[k][1]; }
  const m = Math.hypot(x, y); jx = m ? x / m : 0; jy = m ? y / m : 0; push(true);
}
addEventListener('keydown', e => {
  if (!net || e.target.closest('input') || e.repeat) return;
  if (KEYV[e.key]) { e.preventDefault(); keys.add(e.key); fromKeys(); }
  else if (e.key === ' ') { e.preventDefault(); setButton(true); }
  else if (e.key === 'r') sendReady();
});
addEventListener('keyup', e => {
  if (KEYV[e.key]) { keys.delete(e.key); fromKeys(); }
  else if (e.key === ' ') setButton(false);
});
if (param('auto') != null) start();
// dev.html drives this for bots
window.lgPad = { set(x, y, b) { jx = x; jy = y; if (!!b !== held) setButton(!!b); else push(); }, ready: sendReady, get seat() { return seat; } };
</script>
