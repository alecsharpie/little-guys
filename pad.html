<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d2a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Guys">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Little Guys · Controller</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  html, body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { --c: #8a9a6a; --cl: #c8d8a8; --cd: #4a5a3a; display: flex; flex-direction: column;
    padding: calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    background: radial-gradient(120% 90% at 50% 100%, color-mix(in srgb, var(--c) 22%, var(--bg)) 0%, var(--bg) 75%); }
  body.stun { --c: #8a8a8a; --cl: #c8c8c8; --cd: #555; }
  .top { display: flex; align-items: center; gap: 10px; min-height: 44px; white-space: nowrap; }
  .top .me { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 18px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #guy { width: 32px; height: 48px; image-rendering: pixelated; flex: none; margin-top: -6px; }
  .top .score { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .top .combo { font-size: 16px; font-weight: 900; color: var(--cl); }
  .top .sp { flex: 1; }
  .top .beds { font-size: 13px; letter-spacing: -1px; }
  .top .wave { font-weight: 800; color: var(--ink-2); font-size: 15px; }
  #ready { min-height: 40px; font-size: 16px; padding: 0 16px; }
  #ready.on { background: var(--good); border-color: var(--good); color: #10240c; }
  .ctl { flex: 1; position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; min-height: 0; }
  .zone { position: relative; border-radius: 26px; border: 2px dashed color-mix(in srgb, var(--c) 45%, transparent); overflow: hidden; }
  .zone .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--ink-2); font-size: 13px; font-weight: 700; pointer-events: none; }
  #base, #knob { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  #base { width: 130px; height: 130px; border: 4px solid color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); transition: opacity .2s; }
  #knob { width: 64px; height: 64px; background: radial-gradient(circle at 35% 30%, var(--cl), var(--c) 55%, var(--cd)); box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .rest #base { opacity: .45; } .rest #knob { opacity: .55; }
  #btn { position: absolute; left: 50%; top: 50%; width: min(78%, 64vh, 230px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
  #btn svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #btn .face { position: absolute; inset: 11%; border-radius: 50%; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 35% 30%, var(--cl), var(--c) 55%, var(--cd)); box-shadow: 0 8px 0 var(--cd), 0 10px 20px rgba(0,0,0,.35); transition: transform .06s, box-shadow .06s; }
  #btn.down .face { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 var(--cd), 0 4px 10px rgba(0,0,0,.35); }
  #btn .lbl { font-weight: 900; font-size: clamp(20px, 6vh, 34px); line-height: 1; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  #btn .lbl small { display: block; font-size: .45em; font-weight: 800; margin-top: 4px; opacity: .9; }
  #btn.full .face { animation: glow .25s infinite alternate; }
  @keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.35); } }
  #msg { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); pointer-events: none; text-align: center; font-weight: 900; font-size: 20px; padding: 6px 14px; border-radius: 14px; background: rgba(20,30,10,.75); white-space: nowrap; max-width: 96%; overflow: hidden; text-overflow: ellipsis; }
  #msg:empty { display: none; }
  #msg small { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .shout { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 40px; font-weight: 900; pointer-events: none; opacity: 0; text-shadow: 0 4px 0 rgba(0,0,0,.45); }
  .shout.go { animation: shout 1.3s ease-out; }
  @keyframes shout { 0% { opacity: 0; transform: scale(.5); } 12% { opacity: 1; transform: scale(1.2); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
  .ctl.ouch { animation: ouch .4s; }
  @keyframes ouch { 0% { background: rgba(255, 60, 80, .35); transform: translateX(-10px); } 30% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 100% { background: transparent; transform: none; } }
  #card { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 30, 10, .82); text-align: center; padding: 20px; }
  #card .big { font-size: 30px; font-weight: 900; line-height: 1.15; }
  #card .big small { display: block; font-size: 16px; font-weight: 700; color: var(--ink-2); margin-top: 8px; }
  #card .num { font-size: 120px; font-weight: 900; color: var(--cl); }
  #card .btn { margin-top: 16px; }
  .form { margin: auto; width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .form h1 { margin: 0 0 4px; font-size: 40px; } .form h1 span { color: var(--accent); }
  .form input { font-size: 24px; padding: 12px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--bg-2); text-align: center; width: 100%; touch-action: manipulation; user-select: text; -webkit-user-select: text; }
  .form input.code { letter-spacing: .25em; text-transform: uppercase; font-weight: 900; }
  .form .btn { min-height: 64px; font-size: 22px; }
  .note { color: var(--ink-2); font-size: 15px; }
  #pad, #pad * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .tip { position: fixed; left: 50%; bottom: calc(6px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; display: flex; gap: 8px; align-items: center;
    padding: 6px 8px 6px 12px; border-radius: 12px; background: rgba(20,30,10,.92); border: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
  .tip b { color: var(--ink); } .tip button { border: 0; background: var(--panel); border-radius: 8px; padding: 4px 9px; font-weight: 900; }
  .turn { display: none; position: absolute; left: 0; right: 0; top: 44%; text-align: center; color: var(--ink-2); font-size: 14px; font-weight: 700; pointer-events: none; }
  @media (orientation: portrait) {
    .ctl { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    #stick { order: 2; } #press { order: 1; }
  }
  .shake { animation: shake .3s; }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
</style>
</head>
<body>
<div id="join" class="form">
  <h1>Little <span>Guys</span></h1>
  <input id="name" maxlength="12" placeholder="Your name" autocomplete="nickname" enterkeyhint="go">
  <input id="room" class="code" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters">
  <button id="go" class="btn go">Join the garden</button>
  <div class="note">The code is on the TV. Hold your phone sideways, like a controller.</div>
</div>
<div id="pad" class="hidden" style="display:contents">
  <div class="top">
    <span class="me"><canvas id="guy" width="16" height="24"></canvas><span id="me"></span></span>
    <span class="score" id="score">0</span><span class="combo" id="combo"></span>
    <span class="sp"></span>
    <span class="wave" id="wave"></span><span class="beds" id="beds"></span>
    <button id="ready" class="btn hidden">Ready</button>
  </div>
  <div class="ctl" id="ctl">
    <div class="zone rest" id="stick"><div id="base"></div><div id="knob"></div><div class="hint">drag anywhere here to walk</div></div>
    <div class="zone" id="press">
      <div id="btn">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="7"/><circle id="ring" cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289"/></svg>
        <div class="face"><div class="lbl" id="lbl">BONK</div></div>
      </div>
    </div>
    <div id="msg"></div>
    <div class="shout" id="shout"></div>
  </div>
  <div id="tip" class="tip hidden"><span>Tabs in the way? <b>aA → Hide Toolbar</b>, or <b>Share → Add to Home Screen</b> for full screen</span><button id="tipx">✕</button></div>
  <div id="card" class="hidden"><div><div id="cardmsg" class="big"></div><button id="cardready" class="btn go hidden">Ready</button></div></div>
</div>
<script type="module">
import { joinRoom, param, load, save } from './shared/net.js';
import { SEATS, HOLD_DELAY, CHARGE_TIME, MIN_CHARGE, WATER_EVERY } from './game.js';
import { TEAMS, frame, frameAt } from './sprites/pix.js';
import gardener from './sprites/gardener.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const buzz = p => { try { navigator.vibrate?.(p); } catch (e) {} };

$('name').value = param('name') || load('littleguys-name', '');
$('room').value = (param('room') || '').toUpperCase();
if (param('room')) $('room').classList.add('hidden');

let net = null, seat = null, status = 'connecting', S = null, prev = null, tm = null;

function start() {
  const name = $('name').value.trim().slice(0, 12), code = $('room').value.trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{5}$/.test(code)) { $('room').classList.remove('hidden'); $('room').focus(); $('room').classList.add('shake'); setTimeout(() => $('room').classList.remove('shake'), 300); return; }
  save('littleguys-name', name);
  $('join').classList.add('hidden'); $('pad').classList.remove('hidden');
  net = joinRoom({
    room: code, name, want: param('want'),
    onSeat: s => {
      seat = s; tm = TEAMS[SEATS.indexOf(s)] || TEAMS[0];
      document.body.style.setProperty('--c', tm.c); document.body.style.setProperty('--cl', tm.l); document.body.style.setProperty('--cd', tm.d);
      push(true); render();
    },
    onMessage: m => { if (m && m.t === 's') { prev = S; S = m; feel(); render(); } },
    onStatus: s => { status = s; if (s === 'open') push(true); render(); },
  });
  render();
}
$('go').onclick = start;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

// ---------- what the phone shows ----------
const mine = () => (S && seat && S.p[seat]) || null;
function render() {
  if (!net) return;
  const me = mine(), ph = S?.ph;
  $('me').textContent = me ? me[5] : ($('name').value || 'You');
  $('wave').textContent = S && S.w ? `Wave ${S.w}` : '';
  $('beds').textContent = S && S.w ? S.beds.map(h => h ? '🌱' : '🥀').join('') : '';
  $('score').textContent = me ? me[0].toLocaleString() : '0';
  $('combo').textContent = me && me[1] >= 2 ? `${me[1]}×` : '';
  document.body.classList.toggle('stun', !!(me && me[6]));
  const pre = ph === 'lobby' || ph === 'over';
  const isReady = !!(me && me[4]);
  $('ready').classList.toggle('hidden', !(pre && seat));
  $('ready').classList.toggle('on', isReady);
  $('ready').classList.toggle('go', !isReady);
  $('ready').textContent = isReady ? '✓ Ready' : 'Ready';

  // the button says what it will do here
  const ctx = me ? me[8] : 0;
  btnCtx = ctx;
  const lbl = me && me[6] ? '💫<small>dizzy!</small>'
    : ctx & 2 ? `🥕 TAP<small>${ctx & 1 ? 'harvest · hold: water' : 'to harvest'}</small>`
    : ctx & 1 ? '💧 HOLD<small>to water · tap: bonk</small>'
    : 'BONK<small>hold to spin</small>';
  if ($('lbl').innerHTML !== lbl) $('lbl').innerHTML = lbl;

  let msg = '';
  if (ph === 'lobby') msg = isReady ? `✓ Ready!<small>waiting for the others (${Object.values(S.p).filter(p => p[4]).length}/${S.n})</small>` : 'Practise on the weeds!<small>tap READY when you are set</small>';
  else if (ph === 'break') msg = `Wave cleared!<small>next in ${S.cd}… water and harvest!</small>`;
  else if (me && me[6]) msg = '💫 Dizzy!<small>a friend can bonk you awake</small>';
  else if (me && me[9]) msg = '🍄 GIANT!';
  if ($('msg').innerHTML !== msg) $('msg').innerHTML = msg;

  let card = '';
  if (status === 'full') card = 'This garden is full<small>8 gardeners max. Try again in a bit.</small>';
  else if (status !== 'open' || !seat) card = `Connecting…<small>${status === 'waiting' ? 'looking for the TV' : ''}</small>`;
  else if (!S) card = 'Connected!';
  else if (ph === 'countdown') card = `<div class="num">${S.cd || 'GO'}</div>`;
  else if (ph === 'over' && S.rank) {
    const i = S.rank.indexOf(seat), aw = me && me[7];
    card = `<div style="font-size:56px">${['🥇', '🥈', '🥉'][i] || '#' + (i + 1)}</div><div>${me ? me[0].toLocaleString() : 0} points</div>
      ${aw ? `<div style="font-size:22px;margin-top:10px;color:var(--cl)">${aw[0]} ${esc(aw[1])}<small style="margin-top:2px">${esc(aw[2])}</small></div>` : ''}
      <small>${isReady ? `waiting for the others (${Object.values(S.p).filter(p => p[4]).length}/${S.n})` : 'tap Ready to play again'}</small>`;
  }
  $('card').classList.toggle('hidden', !card);
  if ($('cardmsg').innerHTML !== card) $('cardmsg').innerHTML = card;
  $('cardready').classList.toggle('hidden', ph !== 'over');
  $('cardready').textContent = isReady ? '✓ Ready' : 'Play again';
}
const sendReady = () => { if (net) { net.act({ r: 1 }); buzz(15); } };
$('ready').addEventListener('pointerdown', e => { e.stopPropagation(); sendReady(); });
$('cardready').addEventListener('pointerdown', e => { e.stopPropagation(); sendReady(); });

// my little guy in the corner, in my colour
const gx = $('guy').getContext('2d');
function guy(now) {
  gx.clearRect(0, 0, 16, 24);
  const me = mine(), set = me && me[6] ? 'dizzy' : held ? 'charge' : 'idle';
  const f = frame(gardener, set, frameAt(gardener, set, now / 1000), tm);
  $('guy').width = f.width; $('guy').height = f.height; gx.drawImage(f, 0, 0);
  requestAnimationFrame(guy);
}
requestAnimationFrame(guy);

// ---------- buzz and shout for what happened on the TV ----------
const TEAM = { rain: ['🌧️ RAIN!', [30, 30, 30, 30, 30]], bees: ['🐝 BEES!', [80, 30, 80]], giant: ['🍄 GIANT!', [100, 50, 100]], bloom: ['🌻 BLOOM!', [30, 30, 120]],
  perfect: ['✨ PERFECT!', [30, 30, 30, 30, 120]], queen: ['👑 QUEEN DOWN!', [100, 50, 300]] };
const BUZZ = { hit: 14, kill: [20, 30, 25], clink: [8, 20, 8], ouch: 220, gift: [30, 30, 30, 30, 120], harvest: [20, 40, 60], water: 25, wake: [20, 20, 40], woke: [60, 40, 60], charged: 35, spin: [40, 30, 80], launch: 18 };
function shout(text, color = '#fff') {
  const el = $('shout'); el.textContent = text; el.style.color = color;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
function feel() {
  const a = prev && seat && prev.p[seat], b = mine();
  if (!b) return;
  if (a && b[2] !== a[2]) {
    buzz(BUZZ[b[3]] || 10);
    if (b[3] === 'ouch') { const c = $('ctl'); c.classList.remove('ouch'); void c.offsetWidth; c.classList.add('ouch'); }
    if (b[3] === 'harvest') shout('🥕 +150', 'var(--accent)');
    if (b[3] === 'woke') shout('😳 WOKEN UP!');
    if (b[3] === 'clink') shout('clink! HOLD to spin', '#d8dcff');
    if (b[1] >= 10 && b[1] % 10 === 0 && b[1] !== a[1]) shout(`${b[1]} COMBO! 🔥`, 'var(--cl)');
  }
  if (prev && S.beds.reduce((x, y) => x + y, 0) < prev.beds.reduce((x, y) => x + y, 0) && S.beds.filter(Boolean).length < prev.beds.filter(Boolean).length) { buzz([80, 40, 80]); shout('🥀 a bed wilted!', '#ff9a9a'); }
  if (prev && S.tev !== prev.tev && TEAM[S.tl]) { const [t, v] = TEAM[S.tl]; shout(t); buzz(v); }
  if (prev && prev.ph !== S.ph && S.ph === 'wave') buzz([30, 60, 30]);
}

// ---------- the controller ----------
// Sends {j:[x,y], b} whenever it changes: the stick at most 20 times a second, the button at once.
let jx = 0, jy = 0, held = false, sent = '', lastSend = 0, timer = null, btnCtx = 0, pressAt = 0, pressCtx = 0, buzzedFull = false;
const q = v => Math.round(v * 20) / 20;
function push(force) {
  if (!net || !seat) return;
  const body = { j: [q(jx), q(jy)], b: held ? 1 : 0 }, key = JSON.stringify(body);
  if (key === sent && !force) return;
  const now = performance.now();
  clearTimeout(timer);
  if (force || now - lastSend >= 50) { net.act(body); sent = key; lastSend = now; }
  else timer = setTimeout(() => push(), 50 - (now - lastSend));
}
function setButton(down) {
  if (down === held) return;
  held = down; $('btn').classList.toggle('down', down);
  if (down) { pressAt = performance.now(); pressCtx = btnCtx; buzzedFull = false; buzz(10); }
  push(true);
}

// floating stick: it centres wherever your thumb lands, and follows if you drag past its edge
const R = 52, DEAD = 0.14;
let stickId = null, bx = 0, by = 0, btnId = null;
function rest() {
  const z = $('stick').getBoundingClientRect();
  bx = z.width / 2; by = z.height / 2; place(0, 0); $('stick').classList.add('rest');
}
function place(dx, dy) {
  $('base').style.left = bx + 'px'; $('base').style.top = by + 'px';
  $('knob').style.left = bx + dx + 'px'; $('knob').style.top = by + dy + 'px';
}
function stickMove(cx, cy) {
  const z = $('stick').getBoundingClientRect();
  let dx = cx - z.left - bx, dy = cy - z.top - by, d = Math.hypot(dx, dy);
  if (d > R) { bx += dx * (1 - R / d); by += dy * (1 - R / d); dx *= R / d; dy *= R / d; d = R; }
  place(dx, dy);
  const m = d / R, k = m < DEAD ? 0 : (m - DEAD) / (1 - DEAD);
  jx = d ? dx / d * k : 0; jy = d ? dy / d * k : 0;
  push();
}
addEventListener('pointerdown', e => {
  if (!net || e.target.closest('input,button')) return;
  const st = $('stick').getBoundingClientRect(), pr = $('press').getBoundingClientRect();
  const inside = r => e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (inside(st) && stickId === null) {
    stickId = e.pointerId; $('stick').classList.remove('rest');
    bx = Math.max(R, Math.min(st.width - R, e.clientX - st.left)); by = Math.max(R, Math.min(st.height - R, e.clientY - st.top));
    stickMove(e.clientX, e.clientY);
  } else if (inside(pr) && btnId === null) { btnId = e.pointerId; setButton(true); }
}, { passive: true });
addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e.clientX, e.clientY); }, { passive: true });
const up = e => {
  if (e.pointerId === stickId) { stickId = null; jx = jy = 0; rest(); push(true); }
  if (e.pointerId === btnId) { btnId = null; setButton(false); }
};
addEventListener('pointerup', up); addEventListener('pointercancel', up);
// iOS Safari ignores user-scalable=no: without this, a quick double tap zooms the page and a long press selects text
// and pops the magnifier. Cancelling the touches themselves stops all three; pointer events still arrive. The join
// form is left alone so its text boxes and button work normally.
const ours = e => !e.target.closest('#join');
for (const t of ['touchstart', 'touchmove', 'touchend']) document.addEventListener(t, e => { if (ours(e) && e.cancelable) e.preventDefault(); }, { passive: false });
for (const t of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart']) document.addEventListener(t, e => { if (ours(e)) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') { stickId = btnId = null; jx = jy = 0; held = false; push(true); rest(); } });
addEventListener('resize', rest); requestAnimationFrame(rest);

// the ring round the button: the spin charging up (or the watering can filling the bed), from the moment you press
(function ring(now) {
  let k = 0;
  if (held) {
    const t = (now - pressAt) / 1000;
    k = pressCtx & 1 ? ((t % WATER_EVERY) / WATER_EVERY) : Math.max(0, Math.min(1, (t - HOLD_DELAY) / CHARGE_TIME));
    const full = !(pressCtx & 1) && k >= 1;
    $('btn').classList.toggle('full', full);
    if (full && !buzzedFull) { buzzedFull = true; buzz(30); }
    $('ring').style.stroke = pressCtx & 1 ? '#8ac4ff' : k >= MIN_CHARGE ? '#fff' : 'rgba(255,255,255,.55)';
  } else $('btn').classList.remove('full');
  $('ring').style.strokeDashoffset = 289 * (1 - k);
  requestAnimationFrame(ring);
})(0);

// keys, for testing on a laptop: WASD / arrows walk, space is the button, R is ready
const keys = new Set();
const KEYV = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
function fromKeys() {
  let x = 0, y = 0; for (const k of keys) if (KEYV[k]) { x += KEYV[k][0]; y += KEYV[k][1]; }
  const m = Math.hypot(x, y); jx = m ? x / m : 0; jy = m ? y / m : 0; push(true);
}
addEventListener('keydown', e => {
  if (!net || e.target.closest('input') || e.repeat) return;
  if (KEYV[e.key]) { e.preventDefault(); keys.add(e.key); fromKeys(); }
